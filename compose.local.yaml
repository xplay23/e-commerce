services:
  backend:
    environment: &local-environment
      APP_ENV: development
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${DEV_FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_ENCRYPTION: none
      SMTP_USERNAME: ''
      SMTP_PASSWORD: ''
      ALLOW_SMOKE_TESTS: '1'
  migrate:
    environment: *local-environment
  mail-worker:
    environment: *local-environment
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
    networks: [application]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
